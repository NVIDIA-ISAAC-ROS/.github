name: Isaac ROS validation

on:
  workflow_call:
    inputs:
      snapshot_id:
        description: Immutable debian_manager snapshot produced by the nightly.
        required: true
        type: string
      validation_apt_repository_url:
        description: Exact S3-mounted APT snapshot for validation-* repositories.
        required: true
        type: string
      public_apt_repository_url:
        description: Major-version public CDN APT repository after promotion.
        required: true
        type: string
      x86_runner_labels:
        description: JSON array selecting an x86 GPU Docker runner.
        required: true
        type: string
      thor_runner_labels:
        description: JSON array selecting a Jetson Thor Docker runner.
        required: true
        type: string
      x86_debian_dist:
        description: Debian distribution in the snapshot for x86.
        required: true
        type: string
      thor_debian_dist:
        description: Debian distribution in the snapshot for Thor.
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.platform }})
    # Never execute untrusted fork code on privileged self-hosted GPU runners.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86
            expected_arch: x86_64
            debian_arch: amd64
            isaac_ros_platform: amd64
            isaac_ros_image: >-
              nvcr.io/nvidia/isaac/ros@sha256:3efda0f0e69d0e2465f47759b65075b321f9630e4e9145983931dd5988650c06
            runner_labels: ${{ inputs.x86_runner_labels }}
            debian_dist: ${{ inputs.x86_debian_dist }}
          - platform: thor
            expected_arch: aarch64
            debian_arch: arm64
            isaac_ros_platform: arm64-jetpack
            isaac_ros_image: >-
              nvcr.io/nvidia/isaac/ros@sha256:806fd525ae6404aa3a10d9c27b13b6e6f312361b839b9769fd3cc768a90d7940
            runner_labels: ${{ inputs.thor_runner_labels }}
            debian_dist: ${{ inputs.thor_debian_dist }}

    runs-on: ${{ fromJSON(matrix.runner_labels) }}
    timeout-minutes: 120
    concurrency:
      group: >-
        isaac-ros-validation-${{ github.repository }}-${{ github.sha }}-${{
        matrix.platform }}
      cancel-in-progress: true
    env:
      CI_PLATFORM: ${{ matrix.platform }}
      CI_EXPECTED_ARCH: ${{ matrix.expected_arch }}
      CI_DEBIAN_ARCH: ${{ matrix.debian_arch }}
      CI_DEBIAN_DIST: ${{ matrix.debian_dist }}
      CI_ISAAC_ROS_PLATFORM: ${{ matrix.isaac_ros_platform }}
      CI_ISAAC_ROS_IMAGE: ${{ matrix.isaac_ros_image }}
      CI_SNAPSHOT_ID: ${{ inputs.snapshot_id }}
      CI_REPOSITORY_NAME: ${{ github.event.repository.name }}
      CI_EXTRA_ROSDEPS_REVISION: "31864dfd031fb1119b38dfb3d5071a4887e00905"
      CI_APT_REPOSITORY_URL: >-
        ${{ startsWith(github.event.repository.name, 'validation-') &&
        inputs.validation_apt_repository_url ||
        inputs.public_apt_repository_url }}
      CI_REPOSITORY_KEY_SHA256: >-
        d45fbd909e89914960a66dba17d4c659adf908ab4d6fe2cf55381e9ffe5ce59d
      ROS_DISTRO: jazzy

    steps:
      - name: Reset generated workspace state
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- "$GITHUB_WORKSPACE/ros_ws"

      - name: Check out validation source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          lfs: true
          path: ros_ws/src/source
          persist-credentials: false

      - name: Validate runner and prepare documented Isaac ROS image
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CI_SNAPSHOT_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]
          [[ "$CI_EXTRA_ROSDEPS_REVISION" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$CI_DEBIAN_DIST" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]
          if [[ "$CI_REPOSITORY_NAME" == validation-* ]]; then
            if [[ "$CI_APT_REPOSITORY_URL" != \
              file:///mnt/s3-storage/validation-debs/*/"$CI_SNAPSHOT_ID" ]]; then
              echo "validation-* repositories must use the S3 snapshot" >&2
              exit 1
            fi
            snapshot_path="${CI_APT_REPOSITORY_URL#file://}"
            test -r "$snapshot_path/.isaac-ros-snapshot-layout-v2"
            test -r "$snapshot_path/.isaac-ros-ci/SHA256SUMS"
          elif [[ ! "$CI_APT_REPOSITORY_URL" =~ \
            ^https://isaac\.download\.nvidia\.com/isaac-ros/release-[0-9]+(\.[0-9]+)?/?$ \
          ]]; then
            echo "Public repositories must use the Isaac ROS CDN" >&2
            exit 1
          fi
          if [[ "$CI_APT_REPOSITORY_URL" =~ [[:space:]] ]]; then
            echo "APT repository URL contains whitespace" >&2
            exit 1
          fi
          if [[
            "$CI_APT_REPOSITORY_URL" == *"/../"* ||
            "$CI_APT_REPOSITORY_URL" == *"/./"*
          ]]; then
            echo "APT repository URL contains path traversal" >&2
            exit 1
          fi

          if [[ "$CI_REPOSITORY_NAME" == validation-* ]]; then
            source_head="$(
              git -C ros_ws/src/source log \
                --format=%H \
                --grep='^Update to monorepo commit [0-9a-fA-F]\{40\}$' \
                -n 1 \
                HEAD
            )"
            if [[ -z "$source_head" ]]; then
              echo "Validation repository has no split-source ancestor" >&2
              exit 1
            fi
            source_message="$(
              git -C ros_ws/src/source show -s --format=%B "$source_head"
            )"
            source_pattern='^Update to monorepo commit [0-9a-fA-F]{40}$'
            [[ "$source_message" =~ $source_pattern ]]
            git -C ros_ws/src/source merge-base \
              --is-ancestor "$source_head" HEAD
          fi

          test "$(uname -m)" = "$CI_EXPECTED_ARCH"
          command -v docker
          command -v git-lfs
          docker info >/dev/null

          install -d "$GITHUB_WORKSPACE/ros_ws/ci-logs"
          image_log="$GITHUB_WORKSPACE/ros_ws/ci-logs/$CI_PLATFORM-container-image-pull.log"
          docker pull "$CI_ISAAC_ROS_IMAGE" 2>&1 | tee "$image_log"
          test "$(
            docker image inspect "$CI_ISAAC_ROS_IMAGE" \
              --format '{{.Architecture}}'
          )" = "$CI_DEBIAN_ARCH"
          {
            printf "image=%s\n" "$CI_ISAAC_ROS_IMAGE"
            printf "image_id=%s\n" \
              "$(docker image inspect "$CI_ISAAC_ROS_IMAGE" --format '{{.Id}}')"
          } > "$GITHUB_WORKSPACE/ros_ws/ci-logs/$CI_PLATFORM-container-image.txt"

      - name: Install dependencies, build, and test in Isaac ROS container
        shell: bash
        run: |
          set -euo pipefail
          container_name="isaac-ros-${{ github.repository_id }}-${{
            github.run_id }}-${{ github.run_attempt }}-$CI_PLATFORM"
          docker rm --force "$container_name" >/dev/null 2>&1 || true

          docker_args=(
            run
            --rm
            --interactive
            --name "$container_name"
            --privileged
            --network host
            --ipc host
            --workdir /workspaces/isaac_ros-dev
            --volume "$GITHUB_WORKSPACE:/workspaces/isaac_ros-dev"
            --env "HOST_USER_UID=$(id -u)"
            --env "HOST_USER_GID=$(id -g)"
            --env ISAAC_ROS_WS=/workspaces/isaac_ros-dev
            --env ISAAC_ROS_ACCEPT_EULA=1
            --env NVIDIA_VISIBLE_DEVICES=all
            --env NVIDIA_DRIVER_CAPABILITIES=all
            --env DEBIAN_FRONTEND=noninteractive
            --env CI_PLATFORM
            --env CI_EXPECTED_ARCH
            --env CI_DEBIAN_ARCH
            --env CI_DEBIAN_DIST
            --env CI_ISAAC_ROS_PLATFORM
            --env CI_SNAPSHOT_ID
            --env CI_REPOSITORY_NAME
            --env CI_EXTRA_ROSDEPS_REVISION
            --env CI_APT_REPOSITORY_URL
            --env CI_REPOSITORY_KEY_SHA256
            --env ROS_DISTRO
            --entrypoint /usr/local/bin/scripts/workspace-entrypoint.sh
          )

          gpu_args=(--gpus all)
          if [[ "$CI_PLATFORM" == thor && -f /etc/igx-release ]]; then
            cdi_devices=()
            if command -v nvidia-ctk >/dev/null 2>&1; then
              mapfile -t cdi_devices < <(
                nvidia-ctk cdi list 2>/dev/null || true
              )
            fi
            cdi_gpu_all=false
            for cdi_device in "${cdi_devices[@]}"; do
              if [[ "$cdi_device" == nvidia.com/gpu=all ]]; then
                cdi_gpu_all=true
                break
              fi
            done
            if [[ "$cdi_gpu_all" == true ]]; then
              gpu_args=(--device=nvidia.com/gpu=all)
            else
              gpu_args=(--runtime=nvidia --gpus all)
            fi
          fi
          docker_args+=("${gpu_args[@]}")

          {
            printf 'host_arch=%s\n' "$(uname -m)"
            if [[ -r /etc/nv_tegra_release ]]; then
              printf 'nv_tegra_release='
              cat /etc/nv_tegra_release
            fi
            if [[ -r /etc/igx-release ]]; then
              printf 'igx_release='
              cat /etc/igx-release
            fi
            docker info --format \
              'docker_default_runtime={{.DefaultRuntime}} docker_runtimes={{json .Runtimes}}'
            printf 'gpu_arg=%q\n' "${gpu_args[@]}"
          } > "$GITHUB_WORKSPACE/ros_ws/ci-logs/$CI_PLATFORM-gpu-runtime.txt"

          if [[ "$CI_REPOSITORY_NAME" == validation-* ]]; then
            docker_args+=(
              --volume /mnt/s3-storage:/mnt/s3-storage:ro
            )
          fi

          docker "${docker_args[@]}" "$CI_ISAAC_ROS_IMAGE" /bin/bash -s <<'ISAAC_ROS_CI'
          set -euo pipefail
          workspace="$ISAAC_ROS_WS"
          source_root="$workspace/ros_ws/src/source"
          logs="$workspace/ros_ws/ci-logs"
          setup_dir="/tmp/isaac-ros-validation-$CI_PLATFORM"
          apt_source="/etc/apt/sources.list.d/isaac-ros-ci.list"
          rosdep_source="/etc/ros/rosdep/sources.list.d/00-nvidia-isaac-ci.list"
          repository_key="$setup_dir/repos.key"
          keyring="$setup_dir/nvidia-isaac-ros.gpg"
          extra_rosdeps="$setup_dir/extra_rosdeps.yaml"
          apt_repository_url="${CI_APT_REPOSITORY_URL%/}"

          source /etc/os-release
          test "${VERSION_CODENAME:-}" = noble
          test "$(uname -m)" = "$CI_EXPECTED_ARCH"
          test -r "/opt/ros/${ROS_DISTRO}/setup.bash"
          command -v colcon
          command -v curl
          command -v gpg
          command -v isaac-ros
          command -v rosdep
          command -v sha256sum

          isaac_ros_status="$(isaac-ros status --output json)"
          echo "$isaac_ros_status"
          grep -Fxq 'ISAAC_ROS_ENVIRONMENT=docker-activated' \
            /etc/isaac-ros-cli/environment.conf
          grep -Fq '"mode": "docker"' <<<"$isaac_ros_status"
          grep -Fq '"activation": "active"' <<<"$isaac_ros_status"
          sudo -n true

          if command -v nvidia-smi >/dev/null 2>&1; then
            nvidia-smi
          elif compgen -G "/dev/nvhost*" >/dev/null || test -e /dev/nvidiactl; then
            echo "NVIDIA device nodes are available"
          else
            echo "No NVIDIA GPU is visible in the Isaac ROS container" >&2
            exit 1
          fi

          install -d "$setup_dir" "$logs"
          curl -fsSL https://isaac.download.nvidia.com/isaac-ros/repos.key \
            --output "$repository_key"
          printf "%s  %s\n" "$CI_REPOSITORY_KEY_SHA256" "$repository_key" \
            | sha256sum --check --strict -
          gpg --dearmor --yes --output "$keyring" "$repository_key"
          chmod 0644 "$keyring"

          if [[ "$CI_REPOSITORY_NAME" == validation-* ]]; then
            validation_environment="$(
              realpath -e \
                "${apt_repository_url#file://}/.isaac-ros-ci"
            )"
            case "$validation_environment" in
              /mnt/s3-storage/validation-debs/*/"$CI_SNAPSHOT_ID"/.isaac-ros-ci)
                ;;
              *)
                echo "Invalid validation environment path" >&2
                exit 1
                ;;
            esac
            (
              cd "$validation_environment"
              sha256sum --check --strict SHA256SUMS
            )
            install -m 0644 \
              "$validation_environment/rosdep/extra_rosdeps.yaml" \
              "$extra_rosdeps"

            common_preferences="$(
              realpath -e \
                "$validation_environment/apt-preferences/common"
            )"
            platform_preferences="$validation_environment/apt-preferences/platforms/$CI_ISAAC_ROS_PLATFORM"
            shopt -s nullglob
            validation_preferences=(
              "$common_preferences/"*.pref
            )
            if [[ -d "$platform_preferences" ]]; then
              validation_preferences+=(
                "$platform_preferences/"*.pref
              )
            fi
            shopt -u nullglob
            if (( ${#validation_preferences[@]} == 0 )); then
              echo "Validation environment contains no APT preferences" >&2
              exit 1
            fi
            sudo find /etc/apt/preferences.d \
              -maxdepth 1 -type f \
              \( -name '*isaac-ros-cuda*.pref' -o \
                 -name '*isaac-ros-opencv*.pref' -o \
                 -name '*isaac-ros-tensorrt*.pref' -o \
                 -name '*isaac-ros-jetson*.pref' \) \
              -delete
            sudo install -m 0644 \
              "${validation_preferences[@]}" \
              /etc/apt/preferences.d/
          else
            curl -fsSL \
              "https://raw.githubusercontent.com/NVIDIA-ISAAC-ROS/.github/${CI_EXTRA_ROSDEPS_REVISION}/ci/extra_rosdeps.yaml" \
              --output "$extra_rosdeps"
          fi

          mapfile -t existing_isaac_sources < <(
            grep -lE \
              'isaac\.download\.nvidia\.(com|cn)/isaac-ros/|file:/+mnt/s3-storage/validation-debs/' \
              /etc/apt/sources.list.d/* 2>/dev/null || true
          )
          if (( ${#existing_isaac_sources[@]} > 0 )); then
            sudo rm -f -- "${existing_isaac_sources[@]}"
          fi
          sudo find /etc/ros/rosdep/sources.list.d \
            -maxdepth 1 -type f \
            \( -name '00-nvidia-isaac.list' -o \
               -name '00-nvidia-isaac-*.list' \) \
            -delete

          printf "deb [signed-by=%s] %s %s main\n" \
            "$keyring" "$apt_repository_url" "$CI_DEBIAN_DIST" \
            > "$setup_dir/apt-source.list"
          printf "yaml file://%s\n" "$extra_rosdeps" \
            > "$setup_dir/rosdep-source.list"

          if [[ ! -e /etc/ros/rosdep/sources.list.d/20-default.list ]]; then
            sudo rosdep init
          fi
          sudo install -m 0644 "$setup_dir/apt-source.list" "$apt_source"
          sudo install -m 0644 "$setup_dir/rosdep-source.list" "$rosdep_source"

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lz4
          # ROS-generated setup files assume unset variables expand to empty.
          set +u
          # shellcheck source=/dev/null
          source "/opt/ros/${ROS_DISTRO}/setup.bash"
          set -u

          if [[ "$CI_PLATFORM" == thor ]]; then
            skipped_assets_log="$logs/$CI_PLATFORM-skipped-asset-packages.txt"
            : > "$skipped_assets_log"
            while IFS= read -r -d '' cmake_file; do
              if ! grep -Eq \
                '^[[:space:]]*install_isaac_ros_asset[[:space:]]*\(' \
                "$cmake_file"; then
                continue
              fi
              package_dir="${cmake_file%/CMakeLists.txt}"
              test -f "$package_dir/package.xml"
              touch "$package_dir/COLCON_IGNORE"
              printf '%s\n' "${package_dir#"$source_root"/}" \
                >> "$skipped_assets_log"
            done < <(
              find "$source_root" -type f -name CMakeLists.txt -print0
            )
            sort -o "$skipped_assets_log" "$skipped_assets_log"
          fi

          rosdep update
          rosdep install \
            --from-paths "$source_root" \
            --ignore-src \
            --rosdistro "$ROS_DISTRO" \
            -y

          command -v nvcc
          cat > "$setup_dir/cuda-stream-check.cu" <<'ISAAC_ROS_CUDA_CHECK'
          #include <cuda_runtime.h>

          #include <cstdio>

          int fail(cudaError_t status, const char* operation)
          {
            std::fprintf(
              stderr,
              "%s failed: %s (%d)\n",
              operation,
              cudaGetErrorString(status),
              static_cast<int>(status));
            return 1;
          }

          int main()
          {
            int device_count = 0;
            cudaError_t status = cudaGetDeviceCount(&device_count);
            if (status != cudaSuccess) {
              return fail(status, "cudaGetDeviceCount");
            }
            if (device_count < 1) {
              std::fprintf(stderr, "No CUDA devices are available\n");
              return 1;
            }
            status = cudaSetDevice(0);
            if (status != cudaSuccess) {
              return fail(status, "cudaSetDevice");
            }
            cudaStream_t stream = nullptr;
            status = cudaStreamCreateWithFlags(&stream, cudaStreamNonBlocking);
            if (status != cudaSuccess) {
              return fail(status, "cudaStreamCreateWithFlags");
            }
            status = cudaStreamDestroy(stream);
            if (status != cudaSuccess) {
              return fail(status, "cudaStreamDestroy");
            }
            std::printf("CUDA stream preflight passed with %d device(s)\n", device_count);
            return 0;
          }
          ISAAC_ROS_CUDA_CHECK
          nvcc -std=c++17 \
            "$setup_dir/cuda-stream-check.cu" \
            -o "$setup_dir/cuda-stream-check"
          cuda_check_command=("$setup_dir/cuda-stream-check")
          if [[ "$CI_PLATFORM" == thor ]]; then
            # Thor exposes /dev/nvidia-caps/nvidia-cap1 as root-only. The
            # documented entrypoint intentionally drops to the mapped host
            # user, so CUDA discovery succeeds but stream creation returns
            # cudaErrorNotSupported. Keep dependency installation and builds
            # unprivileged; elevate only GPU execution inside the container.
            cuda_check_command=(
              sudo -n
              "$setup_dir/cuda-stream-check"
            )
          fi
          "${cuda_check_command[@]}" \
            | tee "$logs/$CI_PLATFORM-cuda-stream-check.log"

          dpkg-query -W -f='${binary:Package}\t${Version}\n' \
            | sort \
            > "$logs/${CI_PLATFORM}-debians.tsv"
          apt-cache policy > "$logs/${CI_PLATFORM}-apt-policy.txt"

          repository_index_uri="${apt_repository_url}/dists/${CI_DEBIAN_DIST}/main/binary-${CI_DEBIAN_ARCH}/Packages"
          snapshot_index="$(
            # shellcheck disable=SC2016
            apt-get indextargets \
              --format '$(URI) $(FILENAME)' \
              'Created-By: Packages' \
              | awk -v uri="$repository_index_uri" '
                  BEGIN { gsub("^file:/+", "file:/", uri) }
                  {
                    candidate = $1
                    gsub("^file:/+", "file:/", candidate)
                    if (candidate == uri) {
                      print $2
                      exit
                    }
                  }
                '
          )"
          if [[ -z "$snapshot_index" || ! -r "$snapshot_index" ]]; then
            echo "APT did not cache $repository_index_uri" >&2
            exit 1
          fi
          case "$snapshot_index" in
            *.gz) gzip -dc -- "$snapshot_index" ;;
            *.lz4) lz4 -dc -- "$snapshot_index" ;;
            *.xz) xz -dc -- "$snapshot_index" ;;
            *) cat -- "$snapshot_index" ;;
          esac \
            | awk '
                /^Package: / { package = $2 }
                /^Version: / && package != "" {
                  print package "\t" $2
                }
              ' \
            | sort -u \
            > "$setup_dir/snapshot-versions.tsv"

          validation_debs="$logs/${CI_PLATFORM}-validation-debians.tsv"
          : > "$validation_debs"
          while IFS=$'\t' read -r package version; do
            package_without_arch="${package%%:*}"
            if [[ "$package_without_arch" =~ ^ros-${ROS_DISTRO}-(isaac-|gxf($|-)|ros2-benchmark($|-)|sensor-mounting-rig($|-)) ]]; then
              printf "%s\t%s\n" "$package" "$version" >> "$validation_debs"
              if ! awk -F '\t' \
                -v package="$package_without_arch" \
                -v version="$version" \
                '$1 == package && $2 == version { found = 1 }
                 END { exit !found }' \
                "$setup_dir/snapshot-versions.tsv"; then
                echo "$package=$version is not present in dependency snapshot $CI_SNAPSHOT_ID" >&2
                exit 1
              fi
            fi
          done < "$logs/${CI_PLATFORM}-debians.tsv"

          cd "$workspace/ros_ws"
          mapfile -t packages < <(
            colcon list --base-paths "$source_root" --names-only
          )
          if (( ${#packages[@]} == 0 )); then
            echo "No ROS packages were discovered in the validation repository" >&2
            exit 1
          fi
          printf "%s\n" "${packages[@]}" \
            | tee "$logs/${CI_PLATFORM}-packages.txt"
          colcon build \
            --base-paths "$source_root" \
            --packages-select "${packages[@]}" \
            --symlink-install \
            --continue-on-error \
            --event-handlers console_direct+ \
            --cmake-args -DCMAKE_BUILD_TYPE=Release \
            2>&1 | tee "$logs/${CI_PLATFORM}-build.log"

          set +u
          # shellcheck source=/dev/null
          source install/setup.bash
          set -u

          test_command=(/usr/bin/colcon)
          if [[ "$CI_PLATFORM" == thor ]]; then
            # Launch tests require Thor's root-only NVIDIA capability device.
            # The container has no CI secrets and fork-origin PRs are rejected
            # before runner allocation. sudo filters PATH/PYTHONPATH even with
            # --preserve-env, so pass only the sourced ROS variables required
            # by colcon and its CTest subprocesses through an explicit env.
            test_environment=()
            test_environment_names=(
              AMENT_PREFIX_PATH
              CMAKE_PREFIX_PATH
              COLCON_PREFIX_PATH
              CYCLONEDDS_URI
              FASTRTPS_DEFAULT_PROFILES_FILE
              ISAAC_ROS_ACCEPT_EULA
              ISAAC_ROS_WS
              LD_LIBRARY_PATH
              PATH
              PYTHONPATH
              RCUTILS_COLORIZED_OUTPUT
              RMW_IMPLEMENTATION
              ROS_AUTOMATIC_DISCOVERY_RANGE
              ROS_DISTRO
              ROS_DOMAIN_ID
              ROS_PYTHON_VERSION
              ROS_VERSION
            )
            for environment_name in "${test_environment_names[@]}"; do
              if [[ -v "$environment_name" ]]; then
                test_environment+=(
                  "$environment_name=${!environment_name}"
                )
              fi
            done
            test_command=(
              sudo -n
              /usr/bin/env
              "${test_environment[@]}"
              /usr/bin/colcon
            )
          fi

          set +e
          test_status=0
          "${test_command[@]}" test \
            --packages-select "${packages[@]}" \
            --event-handlers console_direct+ \
            2>&1 | tee "$logs/${CI_PLATFORM}-test.log" \
            || test_status=${PIPESTATUS[0]}

          result_status=0
          "${test_command[@]}" test-result --verbose || result_status=$?
          set -e
          if [[ "$CI_PLATFORM" == thor ]]; then
            # Root-run tests can create root-owned CTest and colcon log
            # directories. Return generated state to the mapped runner user so
            # artifact upload and the next job's unprivileged reset can read
            # and remove it.
            sudo -n chown -R -- \
              "$(id -u):$(id -g)" \
              "$workspace/ros_ws/build" \
              "$workspace/ros_ws/log"
          fi
          if (( test_status != 0 )); then
            exit "$test_status"
          fi
          exit "$result_status"
          ISAAC_ROS_CI

      - name: Record run inputs
        if: always()
        shell: bash
        run: |
          {
            echo "### Isaac ROS container validation: $CI_PLATFORM"
            echo
            echo "- Repository: \`$GITHUB_REPOSITORY\`"
            echo "- Dependency snapshot: \`$CI_SNAPSHOT_ID\`"
            echo "- APT repository: \`$CI_APT_REPOSITORY_URL\`"
            echo "- Debian distribution: \`$CI_DEBIAN_DIST\`"
            echo "- Container image: \`${CI_ISAAC_ROS_IMAGE:-unresolved}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: isaac-ros-${{ matrix.platform }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ros_ws/ci-logs/**
            ros_ws/log/**
            ros_ws/build/**/test_results/**/*.xml

      - name: Remove validation container
        if: always()
        shell: bash
        run: |
          container_name="isaac-ros-${{ github.repository_id }}-${{
            github.run_id }}-${{ github.run_attempt }}-$CI_PLATFORM"
          docker rm --force "$container_name" >/dev/null 2>&1 || true
